[package]
name = "openshell-kata"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "3"
cap-fs-ext = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
# Released OpenShell used by Standalone (v0.1.6-system.2): provider credential
# state, placeholder substitution and the proxy TLS termination primitives.
openshell-core = { git = "https://github.com/gethamster/oss-openshell", rev = "30a2f0b27174d5e65fcc6c82a5de20175c9f7ca5", default-features = false }
openshell-supervisor-network = { git = "https://github.com/gethamster/oss-openshell", rev = "30a2f0b27174d5e65fcc6c82a5de20175c9f7ca5" }
flate2 = "1"
httparse = "1"
hickory-net = { version = "0.26.3", default-features = false, features = ["tokio"] }
hickory-proto = { version = "0.26.3", default-features = false }
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.14"
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prost = "0.14"
prost-types = "0.14"
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false }
rustix = { version = "1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
