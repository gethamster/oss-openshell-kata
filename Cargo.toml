[package]
name = "openshell-kata"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[dependencies]
openshell-supervisor-network = { git = "https://github.com/gethamster/oss-openshell", rev = "a0e9d16c3ef2abed46c8f4eb28f5050b8791fa4b" }
anyhow = "1"
cap-std = "3"
cap-fs-ext = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
flate2 = "1"
httparse = "1"
hickory-net = { version = "0.26.3", default-features = false, features = ["tokio"] }
hickory-proto = { version = "0.26.3", default-features = false }
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.14"
ipnet = "2"
prost = "0.14"
prost-types = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
rustix = { version = "1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
openshell-core = { git = "https://github.com/gethamster/oss-openshell", rev = "a0e9d16c3ef2abed46c8f4eb28f5050b8791fa4b", default-features = false }
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
