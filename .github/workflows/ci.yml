name: Rust

on:
  push:
    paths-ignore:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".agents/**"
      - ".claude/skills/**"
  pull_request:
    paths-ignore:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".agents/**"
      - ".claude/skills/**"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'oss-ubuntu24-x64' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Format
        run: |
          cargo +1.98.0 fmt --check
          cargo +1.98.0 fmt --manifest-path fence-ebpf/Cargo.toml --check
          rustfmt +1.98.0 --edition 2024 --check scripts/build_hosted_fence.rs
      - name: Lint
        run: cargo +1.98.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.98.0 test --locked --all-targets --all-features
      - name: Documentation
        run: cargo +1.98.0 doc --locked --no-deps
      - name: Vendored protocol checksums
        run: cargo +1.98.0 run --locked --bin kata-dev -- verify-upstream
